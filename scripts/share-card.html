<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LiD Test Prep share card</title>
  <style>
    :root {
      --bg: #0c1110;
      --panel: #141a19;
      --raised: #1b2321;
      --soft: #202927;
      --text: #f5f7f5;
      --muted: #aab7b3;
      --line: #34413e;
      --accent: #58c9b5;
      --accent-strong: #75e0cc;
      --correct-bg: #123827;
      --correct-border: #56b878;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "DejaVu Sans", sans-serif;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 60px 72px;
      background:
        radial-gradient(760px 460px at 88% -4%, rgb(88 201 181 / 0.24), transparent 62%),
        radial-gradient(640px 380px at -4% 108%, rgb(88 201 181 / 0.13), transparent 62%),
        var(--bg);
    }
    .brand { display: flex; align-items: center; gap: 20px; }
    .brand img { width: 84px; height: 84px; }
    .brand strong { display: block; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 22px; font-weight: 500; }
    h1 {
      max-width: 640px;
      margin: 44px 0 0;
      font-size: 72px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.025em;
    }
    h1 span { color: var(--accent-strong); }
    .facts { position: absolute; bottom: 54px; left: 72px; display: flex; gap: 14px; }
    .fact {
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgb(27 35 33 / 0.85);
      font-size: 22px;
      font-weight: 700;
    }
    .question {
      position: absolute;
      top: 78px;
      right: 64px;
      width: 392px;
      padding: 26px;
      border: 1px solid #465650;
      border-radius: 28px;
      background: linear-gradient(145deg, rgb(88 201 181 / 0.08), transparent 50%), #161e1c;
      box-shadow: 0 30px 80px rgb(0 0 0 / 0.55);
    }
    .question .kicker { color: var(--accent); font-size: 17px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .question h2 { margin: 12px 0 20px; font-size: 27px; font-weight: 800; line-height: 1.2; }
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--raised);
      font-size: 23px;
      font-weight: 600;
    }
    .option b {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--soft);
      color: var(--muted);
      font-size: 17px;
    }
    .option.correct { border-color: var(--correct-border); background: var(--correct-bg); }
    .option.correct b { background: var(--correct-border); color: #081512; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../assets/lid-logo.svg" alt="">
      <div>
        <strong>LiD Test Prep</strong>
        <span>Learn with clarity</span>
      </div>
    </div>
    <h1>Prepare with clarity.<br><span>Pass with confidence.</span></h1>
    <div class="facts">
      <span class="fact">460 questions</span>
      <span class="fact">All 16 states</span>
      <span class="fact">Exam simulation</span>
    </div>
    <aside class="question" aria-hidden="true">
      <div class="kicker">Question 24</div>
      <h2 lang="de">Wie viele Bundesländer hat die Bundesrepublik Deutschland?</h2>
      <div class="option"><b>A</b>14</div>
      <div class="option"><b>B</b>15</div>
      <div class="option correct"><b>C</b>16</div>
      <div class="option"><b>D</b>17</div>
    </aside>
  </div>
</body>
</html>
