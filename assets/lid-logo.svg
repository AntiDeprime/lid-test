<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LiD logo</title>
  <desc id="desc">The letters L, i and D in dark ink on a mint tile. L and i share one connected stroke, and the dot of the i is paper white.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63d4bf"/>
      <stop offset="1" stop-color="#4fbfab"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <path
    d="M115 172
       V318
       Q115 340 137 340
       H191
       Q213 340 213 318
       V258"
    fill="none"
    stroke="#081512"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <circle cx="213" cy="176" r="28" fill="#f5f7f5"/>
  <path
    d="M295 172
       H313
       A84 84 0 0 1 313 340
       H295
       Z"
    fill="none"
    stroke="#081512"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
