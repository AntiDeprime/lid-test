<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LiD Test Prep - Standalone</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ef;
        --panel: #ffffff;
        --text: #171717;
        --muted: #666761;
        --line: #dddad1;
        --soft: #f0eee8;
        --accent: #1f5f67;
        --accent-strong: #17474d;
        --correct-bg: #e4f4e8;
        --correct-border: #3a9a52;
        --wrong-bg: #fae7e5;
        --wrong-border: #c9463f;
        --warn-bg: #fff3d8;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.72), rgb(255 255 255 / 0) 260px),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .shell {
        width: min(100% - 20px, 920px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 10px 0;
        display: grid;
        align-items: start;
      }

      .app-panel {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 24px 60px rgb(0 0 0 / 0.08);
      }

      .is-hidden {
        display: none !important;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 760;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5.8vw, 2.5rem);
        line-height: 1.14;
        letter-spacing: 0;
      }

      .lede,
      .hint,
      .meta {
        color: var(--muted);
        line-height: 1.55;
      }

      .lede {
        margin: 18px 0 24px;
      }

      .hint,
      .meta {
        margin: 0;
      }

      .topbar {
        display: grid;
        gap: 14px;
      }

      .quiz-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .counter {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fbfaf7;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .progress {
        overflow: hidden;
        height: 8px;
        margin-top: 18px;
        border-radius: 999px;
        background: var(--soft);
      }

      .progress > span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 180ms ease;
      }

      .answers {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .answer-option {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 64px;
        padding: 12px;
        text-align: left;
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }

      .answer-option:hover:not(:disabled),
      .answer-option:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .answer-option:disabled {
        cursor: default;
        opacity: 1;
      }

      .answer-option.is-correct {
        background: var(--correct-bg);
        border-color: var(--correct-border);
      }

      .answer-option.is-wrong {
        background: var(--wrong-bg);
        border-color: var(--wrong-border);
      }

      .option-letter {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-weight: 800;
      }

      .answer-option.is-correct .option-letter {
        background: #d5eadb;
        color: #235f34;
      }

      .answer-option.is-wrong .option-letter {
        background: #f0cfcb;
        color: #8a2e29;
      }

      .primary-action,
      .secondary-action,
      .icon-action {
        min-height: 46px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 760;
      }

      .primary-action {
        width: 100%;
        padding: 0 18px;
        border: 0;
        background: var(--accent);
        color: #fff;
      }

      .primary-action:hover,
      .primary-action:focus-visible {
        background: var(--accent-strong);
        outline: none;
      }

      .secondary-action,
      .icon-action {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--text);
      }

      .secondary-action {
        width: 100%;
        padding: 0 16px;
      }

      .icon-action {
        width: 42px;
        flex: 0 0 42px;
        font-size: 1rem;
      }

      .quiz-bottom {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .image-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 22px;
      }

      figure {
        margin: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
        text-align: center;
      }

      img {
        display: block;
        width: 100%;
        max-height: 230px;
        object-fit: contain;
      }

      figcaption {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .score {
        margin: 16px 0 0;
        font-size: clamp(2.5rem, 18vw, 4.5rem);
        font-weight: 820;
        line-height: 1;
      }

      .result-status {
        margin-top: 20px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .result-status.is-pass {
        background: var(--correct-bg);
        border-color: var(--correct-border);
      }

      .result-status.is-fail {
        background: var(--warn-bg);
        border-color: #d5a531;
      }

      .review-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .review-item {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .review-item strong {
        display: block;
        margin-bottom: 6px;
      }

      @media (min-width: 640px) {
        .shell {
          width: min(100% - 32px, 920px);
          padding: 32px 0;
          align-items: center;
        }

        .app-panel {
          padding: clamp(28px, 4vw, 40px);
        }

        .topbar {
          grid-template-columns: 1fr auto;
          align-items: start;
        }

        .primary-action,
        .secondary-action {
          width: auto;
        }

        .quiz-bottom {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .image-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .image-grid.image-count-1 {
          grid-template-columns: minmax(0, 1fr);
        }

        img {
          max-height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="start-screen" class="app-panel" aria-labelledby="start-title">
        <p class="eyebrow">Leben in Deutschland</p>
        <h1 id="start-title">Practice test</h1>
        <p class="lede">
          33 random questions: 30 general and 3 Berlin questions. Pass threshold for Einbürgerung: 17 correct answers.
        </p>
        <button id="start-button" class="primary-action" type="button">Start test</button>
      </section>

      <section id="quiz-screen" class="app-panel is-hidden" aria-labelledby="question-title">
        <header class="topbar">
          <div>
            <p id="question-kicker" class="eyebrow">Question</p>
            <h1 id="question-title"></h1>
          </div>
          <div class="quiz-actions">
            <span id="score-counter" class="counter">0 correct</span>
            <button id="restart-button" class="icon-action" type="button" title="Restart test" aria-label="Restart test">&#8635;</button>
          </div>
        </header>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <div id="image-grid" class="image-grid is-hidden"></div>
        <div id="answers" class="answers"></div>
        <footer class="quiz-bottom">
          <p id="question-hint" class="hint">Choose one answer.</p>
          <button id="next-button" class="primary-action is-hidden" type="button">Next</button>
        </footer>
      </section>

      <section id="result-screen" class="app-panel is-hidden" aria-labelledby="result-title">
        <p class="eyebrow">Result</p>
        <h1 id="result-title">Result</h1>
        <p id="result-score" class="score">0 / 33</p>
        <div id="result-status" class="result-status">
          <p class="meta">Einbürgerung threshold: 17 correct answers.</p>
        </div>
        <div id="review-list" class="review-list"></div>
        <div class="quiz-bottom">
          <button id="new-test-button" class="primary-action" type="button">Start new test</button>
        </div>
      </section>
    </main>

    <script src="questions.js"></script>
    <script>
      (() => {
        "use strict";

        const TOTAL_GENERAL = 30;
        const TOTAL_STATE = 3;
        const PASS_THRESHOLD = 17;
        const LETTERS = ["A", "B", "C", "D"];

        const questions = window.LID_QUESTIONS || [];
        const state = {
          run: [],
          index: 0,
          selected: null,
          score: 0,
          answers: []
        };

        const $ = (id) => document.getElementById(id);
        const startScreen = $("start-screen");
        const quizScreen = $("quiz-screen");
        const resultScreen = $("result-screen");
        const startButton = $("start-button");
        const restartButton = $("restart-button");
        const newTestButton = $("new-test-button");
        const nextButton = $("next-button");
        const questionKicker = $("question-kicker");
        const questionTitle = $("question-title");
        const scoreCounter = $("score-counter");
        const progressBar = $("progress-bar");
        const imageGrid = $("image-grid");
        const answers = $("answers");
        const questionHint = $("question-hint");
        const resultTitle = $("result-title");
        const resultScore = $("result-score");
        const resultStatus = $("result-status");
        const reviewList = $("review-list");

        function show(screen) {
          startScreen.classList.toggle("is-hidden", screen !== "start");
          quizScreen.classList.toggle("is-hidden", screen !== "quiz");
          resultScreen.classList.toggle("is-hidden", screen !== "result");
        }

        function shuffle(items) {
          const copy = items.slice();
          for (let i = copy.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }

        function sampleByCategory(category, count) {
          return shuffle(questions.filter((question) => question.category === category)).slice(0, count);
        }

        function startRun() {
          const general = sampleByCategory("general", TOTAL_GENERAL);
          const stateQuestions = sampleByCategory("state", TOTAL_STATE);
          state.run = shuffle([...general, ...stateQuestions]);
          state.index = 0;
          state.selected = null;
          state.score = 0;
          state.answers = [];
          renderQuestion();
          show("quiz");
        }

        function renderImages(question) {
          imageGrid.replaceChildren();
          imageGrid.className = `image-grid image-count-${question.images.length}`;
          imageGrid.classList.toggle("is-hidden", question.images.length === 0);

          question.images.forEach((image) => {
            const figure = document.createElement("figure");
            const img = document.createElement("img");
            const caption = document.createElement("figcaption");
            img.src = image.src;
            img.alt = image.label;
            caption.textContent = image.label;
            figure.append(img, caption);
            imageGrid.append(figure);
          });
        }

        function renderQuestion() {
          const question = state.run[state.index];
          const progress = state.index + 1;
          const total = state.run.length;

          questionKicker.textContent = `Question ${progress} / ${total}`;
          questionTitle.textContent = question.prompt;
          scoreCounter.textContent = `${state.score} correct`;
          progressBar.style.width = `${((progress - 1) / total) * 100}%`;
          questionHint.textContent = "Choose one answer.";
          nextButton.classList.add("is-hidden");
          nextButton.textContent = progress === total ? "Finish" : "Next";
          state.selected = null;

          renderImages(question);
          renderAnswers(question);
        }

        function renderAnswers(question) {
          answers.replaceChildren();

          question.options.forEach((option, index) => {
            const button = document.createElement("button");
            const letter = document.createElement("span");
            const text = document.createElement("span");

            button.className = "answer-option";
            button.type = "button";
            button.dataset.index = String(index);
            letter.className = "option-letter";
            letter.textContent = LETTERS[index];
            text.textContent = option.text;

            button.append(letter, text);
            button.addEventListener("click", () => chooseAnswer(index));
            answers.append(button);
          });
        }

        function chooseAnswer(selectedIndex) {
          if (state.selected !== null) return;

          const question = state.run[state.index];
          const correctIndex = question.options.findIndex((option) => option.correct);
          const isCorrect = selectedIndex === correctIndex;
          state.selected = selectedIndex;
          state.score += isCorrect ? 1 : 0;
          state.answers.push({
            question,
            selectedIndex,
            correctIndex,
            isCorrect
          });

          [...answers.children].forEach((button, index) => {
            button.disabled = true;
            if (index === correctIndex) button.classList.add("is-correct");
            if (index === selectedIndex && !isCorrect) button.classList.add("is-wrong");
          });

          scoreCounter.textContent = `${state.score} correct`;
          progressBar.style.width = `${((state.index + 1) / state.run.length) * 100}%`;
          questionHint.textContent = isCorrect ? "Correct answer." : "Wrong answer.";
          nextButton.classList.remove("is-hidden");
          nextButton.focus();
        }

        function nextQuestion() {
          if (state.selected === null) return;

          if (state.index === state.run.length - 1) {
            renderResult();
            show("result");
            return;
          }

          state.index += 1;
          renderQuestion();
        }

        function renderResult() {
          const passed = state.score >= PASS_THRESHOLD;
          resultTitle.textContent = passed ? "Passed" : "Not passed";
          resultScore.textContent = `${state.score} / ${state.run.length}`;
          resultStatus.className = `result-status ${passed ? "is-pass" : "is-fail"}`;
          resultStatus.innerHTML = `<p class="meta">Einbürgerung threshold: ${PASS_THRESHOLD} correct answers.</p>`;
          renderReview();
        }

        function renderReview() {
          reviewList.replaceChildren();
          const missed = state.answers.filter((entry) => !entry.isCorrect);

          if (missed.length === 0) {
            const item = document.createElement("div");
            item.className = "review-item";
            item.innerHTML = "<strong>No mistakes</strong><p class=\"meta\">All answers in this run were correct.</p>";
            reviewList.append(item);
            return;
          }

          missed.slice(0, 6).forEach((entry) => {
            const item = document.createElement("div");
            const selected = entry.question.options[entry.selectedIndex].text;
            const correct = entry.question.options[entry.correctIndex].text;
            item.className = "review-item";
            item.innerHTML = `
              <strong>${escapeHtml(entry.question.prompt)}</strong>
              <p class="meta">Your answer: ${escapeHtml(selected)}</p>
              <p class="meta">Correct answer: ${escapeHtml(correct)}</p>
            `;
            reviewList.append(item);
          });
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        startButton.addEventListener("click", startRun);
        restartButton.addEventListener("click", startRun);
        newTestButton.addEventListener("click", startRun);
        nextButton.addEventListener("click", nextQuestion);

        if (!questions.length) {
          startButton.disabled = true;
          startButton.textContent = "Question data missing";
        }
      })();
    </script>
  </body>
</html>
